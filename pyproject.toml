[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2hand"
version = "0.0.1"
description = "Personalised Handwriting Synthesis from a Single Page via Stroke-Level Modelling: realistic handwritten A4 PDF/DOCX documents, including your own handwriting."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Dhruv Agarwalla" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "python-docx>=1.1",
    "fonttools>=4.50",
    "pydantic>=2.6",
    "typer>=0.12",
    "gradio>=4.40",
]

[project.optional-dependencies]
# Installed from iteration 8 onward (CPU wheels: see README)
ml = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
handwriter = "handwriter.app.cli:app"
text2hand = "handwriter.app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # Typer/Gradio use calls in argument defaults by design
